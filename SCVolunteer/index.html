<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoJSON Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100%; width: 100%; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  const GEOJSON_FILE = 'EnbridgeMapExtract.geojson';

  const map = L.map('map');

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function onEachFeature(feature, layer) {
    const rows = Object.entries(feature.properties || {})
      .map(([k, v]) => `<tr><th style="text-align:left;padding-right:8px;">${escapeHtml(k)}</th><td>${escapeHtml(String(v))}</td></tr>`)
      .join('');
    if (rows) layer.bindPopup(`<table>${rows}</table>`);
  }

  fetch(GEOJSON_FILE)
    .then(response => response.json())
    .then(data => {
      const layer = L.geoJSON(data, {
        style: () => ({ color: '#d62828', weight: 2, fillColor: '#d62828', fillOpacity: 0.3 }),
        pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
          radius: 6, color: '#d62828', fillColor: '#d62828', fillOpacity: 0.8, weight: 1
        }),
        onEachFeature: onEachFeature
      }).addTo(map);

      const bounds = layer.getBounds();
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [30, 30] });
      } else {
        map.setView([20, 0], 2);
      }
    })
    .catch(err => console.error('Could not load GeoJSON:', err));
</script>
</body>
</html>
